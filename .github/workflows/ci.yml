name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  server-image:
    name: server image (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false

  companion:
    name: companion (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 고정 서명 키(저장소 비밀값). 없으면(포크 PR 등) 기본 디버그 키로 빌드된다
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit.p12"
            echo "ORBIT_KEYSTORE_PATH=$RUNNER_TEMP/orbit.p12" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew assembleDebug --console=plain
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: companion-debug-apk
          path: companion/app/build/outputs/apk/debug/app-debug.apk
