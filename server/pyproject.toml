[project]
name = "orbit-server"
version = "0.1.0"
description = "Orbit home server: ingest API for the Companion app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
orbit-server = "orbit_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbit_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
