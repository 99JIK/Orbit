[project]
name = "orbit-server"
version = "0.1.0"
description = "Orbit home server: ingest API and worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6",
    # Windows에는 시스템 시간대 DB가 없어 zoneinfo가 Asia/Seoul을 못 찾는다
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pypdf>=4", "mcp>=1.20,<2"]
stt = ["faster-whisper>=1.1"]
# CTranslate2 GPU 추론용 CUDA 12 런타임. 시스템에 cuBLAS·cuDNN 9가 있으면 불필요
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# worker의 공유 자료 처리와 Google Calendar 등록
worker = ["pypdf>=4", "google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
# 외부 AI용 MCP 서버 (docs/mcp.md)
mcp = ["mcp>=1.20,<2"]

[project.scripts]
orbit-server = "orbit_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbit_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
